spring:
  application:
    name: batch-writer

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:chat_db}
    username: ${POSTGRES_USER:chat_user}
    password: ${POSTGRES_PASSWORD:super_secret_postgres_pw}

  jpa:
    hibernate:
      # Legt die Tabelle message beim Start aus der Entity an (Spezifikation 4.1)
      ddl-auto: update
    open-in-view: false

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:chat_user}
    password: ${RABBITMQ_PASSWORD:rabbit_password}
    listener:
      simple:
        # Ack erst nach erfolgreichem Commit, sonst Rollback
        acknowledge-mode: auto
        # Puffer fuer hohe Last (S3), ohne die Queue komplett vorab zu holen
        prefetch: 500
        # Bei Fehler bleibt die Nachricht in der Queue (S7)
        default-requeue-rejected: true
        retry:
          enabled: true
          initial-interval: 1000
          max-interval: 10000
          multiplier: 2.0
          max-attempts: 10

app:
  # Spring-Platzhalter: Default 100. ":-" ist bash-Syntax und ergaebe -100.
  batch-size: ${BATCH_SIZE:100}