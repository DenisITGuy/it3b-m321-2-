spring:
  application:
    name: batch-writer

  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:chat_db}
    username: ${POSTGRES_USER:chat_user}
    password: ${POSTGRES_PASSWORD:super_secret_postgres_pw}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:chat_user}
    password: ${RABBITMQ_PASSWORD:rabbit_password}
    listener:
      simple:
        acknowledge-mode: auto          # ✅ Explizit setzen
        prefetch: 500                    # ✅ WICHTIG: Holt 500 Nachrichten auf einmal für Performance (S3)
        default-requeue-rejected: true   # ✅ Nachricht zurück in Queue bei Fehler
        retry:
          enabled: true
          initial-interval: 1000         # 1s warten
          max-interval: 10000            # Max 10s warten
          multiplier: 2.0                # Verdoppeln: 1s → 2s → 4s → 8s → 10s
          max-attempts: 10               # ⬆️ ERHÖHT von 5 auf 10 (S7: DB-Ausfall 15s!)

app:
  batch-size: ${BATCH_SIZE:-100}