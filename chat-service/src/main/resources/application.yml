spring:
  application:
    name: chat-service

  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:chat_db}
    username: ${POSTGRES_USER:chat_user}
    password: ${POSTGRES_PASSWORD:super_secret_postgres_pw}

  hikari:
      # Kurzes Timeout, damit Nachholen bei gestoppter Datenbank schnell 503 gibt
      # statt nach dem 30-s-Standard von HikariCP.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:chat_user}
    password: ${RABBITMQ_PASSWORD:rabbit_password}
    # Heartbeats aus: eine pausierte Instanz sendet keine Heartbeats, der Broker
    # wuerde sonst die Verbindung schliessen und die exclusive Queue loeschen (S6).
    # Beim Container-Stop schliesst der Socket trotzdem, S4 bleibt erfuellt.
    requested-heartbeat: ${RABBITMQ_REQUESTED_HEARTBEAT:0}

# live.queue.name steht bewusst NICHT hier: ChatApplication.main setzt den Namen
# als Default-Property. Ein Eintrag hier wuerde ihn ueberschreiben, und alle
# Instanzen haetten denselben Queue-Namen.
live:
  prefetch: ${LIVE_QUEUE_PREFETCH:10}
  max-length: ${LIVE_QUEUE_MAX_LENGTH:1000}

server:
  port: 8080