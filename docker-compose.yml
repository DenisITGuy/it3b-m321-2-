services:
  # ---------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16.1-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chat-net

  # ---------------------------------------------------------------
  # RabbitMQ
  # WICHTIG: Keine ports, damit S2 besteht!
  # ---------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.12-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chat-net

  # ---------------------------------------------------------------
  # chat-service (Producer und Live-Zustellung)
  # WICHTIG: Kein container_name, damit --scale funktioniert!
  # WICHTIG: Keine ports, damit S2 besteht!
  # ---------------------------------------------------------------
  chat-service:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      LIVE_QUEUE_MAX_LENGTH: ${LIVE_QUEUE_MAX_LENGTH:-1000}
      LIVE_QUEUE_PREFETCH: ${LIVE_QUEUE_PREFETCH:-10}
      RABBITMQ_REQUESTED_HEARTBEAT: ${RABBITMQ_REQUESTED_HEARTBEAT:-0}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-3000}
    networks:
      - chat-net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ---------------------------------------------------------------
  # batch-writer (Consumer)
  # WICHTIG: Kein container_name, damit S6 (--scale) funktioniert!
  # WICHTIG: Keine ports, damit S2 besteht!
  # ---------------------------------------------------------------
  batch-writer:
    build:
      context: .
      dockerfile: batch-writer/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      BATCH_SIZE: ${BATCH_SIZE:-100}
    networks:
      - chat-net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

networks:
  chat-net:
    driver: bridge

volumes:
  postgres_data:
